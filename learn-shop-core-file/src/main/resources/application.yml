springdoc:
  swagger-ui:
    # 修改Swagger UI路径
    path: /doc.html
    # 开启Swagger UI界面
    enabled: true
    # 默认折叠
    doc-expansion: none
    # 方法字母排序
    operations-sorter: alpha
    # 类字母排序
    tags-sorter: alpha
  api-docs:
    # 修改api-docs路径
    path: /v3/api-docs
    # 开启api-docs
    enabled: true
    version: openapi_3_1
  packages-to-scan:
    - com.billow.file.api #必须要有 GetMapping，PostMapping...
swagger: #接口注解文档
  service:
    name: ${spring.application.name} #api名称
    version: 4.0
    description: 警告：此API仅用于测试，禁止任何商业用途，否则一切后果自行承担！！！ #api描述
    contact:
      developer: billow #api开发者
      url: https://github.com/Xiao-Y/learn
      email: lyongtao123@126.com #api开发者

server:
  port: 9911
  servlet:
    context-path: /core-file
spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB  # 增大单个文件限制
      max-request-size: 1GB # 增大整个请求限制
  profiles:
    active: dev
  application:
    name: learn-shop-core-file
  config:
    import: optional:nacos:${spring.application.name}.yml
  # 数据源配置
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:nacos:sys-config-db.yml

minio:
  enabled: true
  endpoint: http://127.0.0.1:9000
  accessKey: access_learn-shop
  secretKey: secret_learn-shop
  bucketName: learn-shop-${spring.profiles.active:dev}