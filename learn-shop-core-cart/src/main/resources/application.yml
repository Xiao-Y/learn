springdoc:
  swagger-ui:
    # 修改Swagger UI路径
    path: /doc.html
    # 开启Swagger UI界面
    enabled: true
    # 默认折叠
    doc-expansion: none
    # 方法字母排序
    operations-sorter: alpha
    # 类字母排序
    tags-sorter: alpha
  api-docs:
    # 修改api-docs路径
    path: /v3/api-docs
    # 开启api-docs
    enabled: true
    version: openapi_3_1
  packages-to-scan:
    - com.billow.cart.api #必须要有 GetMapping，PostMapping...
swagger: #接口注解文档
  service:
    name: ${spring.application.name} #api名称
    version: 4.0
    description: 警告：此API仅用于测试，禁止任何商业用途，否则一切后果自行承担！！！ #api描述
    contact:
      developer: billow #api开发者
      url: https://github.com/Xiao-Y/learn
      email: lyongtao123@126.com #api开发者

server:
  port: 8909
  servlet:
    context-path: /core-cart

spring:
  application:
    name: learn-shop-core-cart
  config:
    import: optional:nacos:${spring.application.name}.yml
  # 数据源配置
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:nacos:sys-config-db.yml

# 购物车配置
cart:
  # Redis配置
  redis:
    database: 0
    expire: 7  # 购物车数据过期天数
    prefix: "cart"  # 键前缀
  
  # 限制配置
  limit:
    maxItems: 99  # 最大商品种类数
    maxQuantity: 999  # 单个商品最大数量
    maxTotal: 999  # 购物车最大总数量
    
  # 异步任务配置
  async:
    corePoolSize: 5
    maxPoolSize: 10
    queueCapacity: 100
    
  # 分布式锁配置
  lock:
    timeout: 3  # 锁超时时间（秒）
    retry: 3  # 重试次数
    
  # 数据同步配置
  sync:
    interval: 300  # 同步间隔（秒）
    batchSize: 100  # 批量同步大小
    
  # 监控配置
  monitor:
    responseTime: 500  # 响应时间阈值（毫秒）
    errorRate: 0.01  # 错误率阈值
    hitRate: 0.9  # 缓存命中率阈值

# 日志配置
logging:
  level:
    com.billow.cart: debug
    org.springframework: warn 