springdoc:
  swagger-ui:
    # 修改Swagger UI路径
    path: /doc.html
    # 开启Swagger UI界面
    enabled: true
    # 默认折叠
    doc-expansion: none
    # 方法字母排序
    operations-sorter: alpha
    # 类字母排序
    tags-sorter: alpha
  api-docs:
    # 修改api-docs路径
    path: /v3/api-docs
    # 开启api-docs
    enabled: true
    version: openapi_3_1
  packages-to-scan:
    - com.billow.system.api #必须要有 GetMapping，PostMapping...
swagger: #接口注解文档
  service:
    name: ${spring.application.name} #api名称
    version: 4.0
    description: 警告：此API仅用于测试，禁止任何商业用途，否则一切后果自行承担！！！ #api描述
    contact:
      developer: billow #api开发者
      url: https://github.com/Xiao-Y/learn
      email: lyongtao123@126.com #api开发者

server:
  port: 8811
  servlet:
    context-path: /admin-system
spring:
  profiles:
    active: dev
  application:
    name: learn-shop-admin-system #客户端名称
  config:
    import: optional:nacos:${spring.application.name}.yml
  # 数据源配置
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:nacos:sys-config-sharding-jdbc.yml
# Excel 模块配置
learn:
  excel:
    # 文件上传路径
    fileBasePath: D:/workspace/idea/billow-excel/
    # 字典配置
    dict:
      # Redis字典前缀，用于在Redis中存储字典数据时的键前缀
      # 例如：如果前缀为"DICT:"，字典编码为"USER_STATUS"，则最终的Redis键为"DICT:USER_STATUS"
      redis-key-prefix: "comm:dic_field_type:admin-system"

      # 是否启用枚举字典自动扫描
      # true: 启用自动扫描，会扫描指定包路径下的枚举类
      # false: 禁用自动扫描，需要手动注册枚举字典
      enable-enum-scan: true

      # 枚举字典扫描包路径
      # 配置需要扫描的包路径，支持多个包路径
      # 只有实现了DictEnum接口的枚举类才会被注册为字典
      enum-scan-packages:
        - "com.billow.system.common.enums" # Excel模块的枚举包
