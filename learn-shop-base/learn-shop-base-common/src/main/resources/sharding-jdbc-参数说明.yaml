# JDBC 逻辑库名称。在集群模式中，使用该参数来联通 ShardingSphere-JDBC 与 ShardingSphere-Proxy。默认值：logic_db
#databaseName (?):


# 1. mode 运行模式

# 1.1 主要配置
# mode (?): # 不配置则默认单机模式
#  type: # 运行模式类型。可选配置：Standalone、Cluster
#  repository (?): # 持久化仓库配置

## 1.1.1 单例示例
#mode:
#  type: Standalone
#  repository:
#    type: # 持久化仓库类型
#    props: # 持久化仓库所需属性
#      foo_key: foo_value
#      bar_key: bar_value

mode:
  type: Standalone
#  repository:
#    type: JDBC

## 1.2 集群配置
#mode:
#  type: Cluster
#  repository:
#    type: # 持久化仓库类型
#    props: # 持久化仓库所需属性
#      namespace: # 注册中心命名空间
#      server-lists: # 注册中心连接地址
#      foo_key: foo_value
#      bar_key: bar_value


### 1.2.1 集群示例
