rules:
  - !SINGLE
    tables:
      - "*.*"


  - !READWRITE_SPLITTING
    dataSourceGroups:
      readwrite_ds:
        writeDataSourceName: 317a_master
        readDataSourceNames:
          - 317c_slave_of_317a
          - 327b_slave_of_317a
        transactionalReadQueryStrategy: PRIMARY
        loadBalancerName: random
    loadBalancers:
      random:
        type: RANDOM


