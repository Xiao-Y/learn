springdoc:
  swagger-ui:
    # 修改Swagger UI路径
    path: /doc.html
    # 开启Swagger UI界面
    enabled: true
    # 默认折叠
    doc-expansion: none
    # 方法字母排序
    operations-sorter: alpha
    # 类字母排序
    tags-sorter: alpha
  api-docs:
    # 修改api-docs路径
    path: /v3/api-docs
    # 开启api-docs
    enabled: true
    version: openapi_3_1
  packages-to-scan:
    - com.billow.gateway.api #必须要有 GetMapping，PostMapping...
    - com.billow.gateway.security.api
swagger: #接口注解文档
  service:
    name: ${spring.application.name} #api名称
    version: 4.0
    description: 警告：此API仅用于测试，禁止任何商业用途，否则一切后果自行承担！！！ #api描述
    contact:
      developer: billow #api开发者
      url: https://github.com/Xiao-Y/learn
      email: lyongtao123@126.com #api开发者
server:
  port: 8771


auth:
  token:
    alias: jwt
    jwtFileName: jwt.jks
    jwtPassword: 123456789

spring:
  profiles:
    active: dev
  application:
    name: learn-cloud-gateway
  config:
    # 配置公用文件（新版本使用列表格式）
    import:
      - optional:nacos:${spring.application.name}.yml
  cloud:
    loadbalancer:
      client:
        # 连接超时（默认10s）
        connect-timeout: 10000
        # 读取超时（默认15s）
        read-timeout: 15000
      # 重试配置（如需开启）
      retry:
        enabled: true
        max-retries-on-next-service: 1  # 切换服务实例的重试次数
        max-retries-on-same-service: 1  # 同一服务实例的重试次数
    gateway:
      routes:
        - id: admin-system
          # lb代表从注册中心获取服务，且已负载均衡方式转发
          uri: lb://learn-shop-admin-system
          predicates:
            - Path=/admin-system/**
        - id: core-order
          # lb代表从注册中心获取服务，且已负载均衡方式转发
          uri: lb://learn-shop-core-order
          predicates:
            - Path=/core-order/**
        - id: core-product
          # lb代表从注册中心获取服务，且已负载均衡方式转发
          uri: lb://learn-shop-core-product
          predicates:
            - Path=/core-product/**
        - id: core-search
          # lb代表从注册中心获取服务，且已负载均衡方式转发
          uri: lb://learn-shop-core-search
          predicates:
            - Path=/core-search/**
        - id: core-cart
          # lb代表从注册中心获取服务，且已负载均衡方式转发
          uri: lb://learn-shop-core-cart
          predicates:
            - Path=/core-cart/**

# 自己定义安全配置
secure:
  client: # 登陆客户端配置
    client-id: webapp
    client-secret: webapp
    scope: webapp
    grant-type: password
    access-token-uri: "http://learn-shop-public-auth/oauth/token"
  white-list:
    - "/actuator/**"              # 健康检查
    - "/userApi/*"                # 获取用户信息
    - "/public-auth/oauth/token"  # 获取token或者刷新token
    - "/public-auth/rsa/publicKey"  # 获取公钥
    - "/admin-system/deployImageAction/**" # 获取部署图片
    - /dataRecovery/initData     # 数据还原
    # swagger 配置
    - /v3/**
    - /*/v3/**
    - /webjars/**
    - /*/*App/**
    - /doc.html
  need-check:
    - /*/*Api/**
    - /*Api/**